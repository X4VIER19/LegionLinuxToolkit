[package]
name = "legion-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
experimental-fan-trial-monitor = ["experimental-fan-control-preflight", "legion-linux/experimental-fan-trial-monitor"]
# Opt-in forwarding for the separate experimental real-read binary.
# Ordinary `status` uses only the dedicated Linux read-only status feature.
approved-real-platform-profile-read = ["legion-linux/approved-real-platform-profile-read"]
# This forwards only to a separately named experimental binary. The default
# Other diagnostics remain simulated; only explicit `status` acquires hwmon.
approved-real-hwmon-rpm-read = ["legion-linux/approved-real-hwmon-rpm-read"]
experimental-fan-control-preflight = ["legion-linux/experimental-fan-control-plan"]
experimental-fan-full-speed-read = ["legion-linux/experimental-fan-full-speed-read"]

[[bin]]
name = "legion-cli-fan-trial-monitor"
path = "src/bin/legion-cli-fan-trial-monitor.rs"
required-features = ["experimental-fan-control-preflight"]

[[bin]]
name = "legion-cli-fan-full-speed-read"
path = "src/bin/legion-cli-fan-full-speed-read.rs"
required-features = ["experimental-fan-full-speed-read"]

[[bin]]
name = "legion-cli-fan-control-preflight"
path = "src/bin/legion-cli-fan-control-preflight.rs"
required-features = ["experimental-fan-control-preflight"]

[[bin]]
name = "legion-cli-platform-profile-real-read"
path = "src/bin/legion-cli-platform-profile-real-read.rs"
required-features = ["approved-real-platform-profile-read"]

[[bin]]
name = "legion-cli-hwmon-rpm-real-read"
path = "src/bin/legion-cli-hwmon-rpm-real-read.rs"
required-features = ["approved-real-hwmon-rpm-read"]

[dependencies]
legion-core = { path = "../legion-core" }
legion-fan = { path = "../legion-fan" }
legion-fixtures = { path = "../legion-fixtures" }
legion-linux = { path = "../legion-linux", features = ["linux-status"] }
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
