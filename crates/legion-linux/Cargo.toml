[package]
name = "legion-linux"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
# Deliberately opt-in and never enabled by default. It exposes only the
# separately reviewed, one-shot experimental binary; it must not be used by
# normal builds, tests, or legion-cli.
approved-real-platform-profile-read = []
# Compiles the reviewed DMI acquisition shape, but intentionally exposes no
# activation, root path, or real-host constructor.
experimental-dmi-identity-read = []
approved-real-dmi-identity-read = ["experimental-dmi-identity-read"]

[[bin]]
name = "legion-linux-dmi-identity-real-read"
path = "src/bin/legion-linux-dmi-identity-real-read.rs"
required-features = ["approved-real-dmi-identity-read"]

[[bin]]
name = "legion-linux-platform-profile-real-read"
path = "src/bin/legion-linux-platform-profile-real-read.rs"
required-features = ["approved-real-platform-profile-read"]

[dependencies]
legion-core = { path = "../legion-core" }
rustix = { version = "1.1.5", features = ["fs"] }
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
