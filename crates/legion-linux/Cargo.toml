[package]
name = "legion-linux"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
experimental-fact-read = []
# Deliberately opt-in and never enabled by default. It exposes only the
# separately reviewed, one-shot experimental binary; it must not be used by
# normal builds, tests, or legion-cli.
approved-real-platform-profile-read = []
# Compiles the reviewed DMI acquisition shape, but intentionally exposes no
# activation, root path, or real-host constructor.
experimental-dmi-identity-read = []
approved-real-dmi-identity-read = ["experimental-dmi-identity-read"]
# Explicitly opt-in; normal builds expose no host hwmon reader or executable.
# It includes the already-reviewed one-shot DMI reader solely to gate the fixed
# 83EX identity before a future RPM observation.
approved-real-hwmon-rpm-read = ["approved-real-dmi-identity-read"]
# Compiles an unconstructable fan-WMI transport shape only. It has no host
# constructor and always fails closed: a supported kernel-space WMI driver is
# still required before any firmware call can be considered.
experimental-fan-wmi-transport = []
# Offline MethodId 6 plan only; no callable write transport or host endpoint.
experimental-fan-control-plan = ["experimental-fan-wmi-transport"]
experimental-fan-full-speed-read = ["experimental-fan-control-plan"]
# Builds a planning-only entry point. It cannot invoke the transport or reach
# a host WMI device, and is never enabled by default.
experimental-fan-wmi-read = ["experimental-fan-wmi-transport"]

[[bin]]
name = "legion-linux-dmi-identity-real-read"
path = "src/bin/legion-linux-dmi-identity-real-read.rs"
required-features = ["approved-real-dmi-identity-read"]

[[bin]]
name = "legion-linux-platform-profile-real-read"
path = "src/bin/legion-linux-platform-profile-real-read.rs"
required-features = ["approved-real-platform-profile-read"]

[[bin]]
name = "legion-linux-fan-wmi-read-experiment"
path = "src/bin/legion-linux-fan-wmi-read-experiment.rs"
required-features = ["experimental-fan-wmi-read"]

[[bin]]
name = "legion-linux-fan-response-analyzer"
path = "src/bin/legion-linux-fan-response-analyzer.rs"

[dependencies]
legion-core = { path = "../legion-core" }
legion-fan = { path = "../legion-fan" }
rustix = { version = "1.1.5", features = ["fs"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
legion-fixtures = { path = "../legion-fixtures" }

[lints]
workspace = true
