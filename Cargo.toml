[workspace]
members = [
    "crates/legion-core",
    "crates/legion-cli",
    "crates/legion-fixtures",
    "crates/legion-fan",
    "crates/legion-linux",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["x4vier19"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
